version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: target_dev
      POSTGRES_PASSWORD: target_dev
      POSTGRES_DB: target_db
    ports:
      - "5433:5432"
    volumes:
      - target_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U target_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  target_pgdata:
