name: Deploy a producción

on:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, typecheck, tests y build
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrar y desplegar a producción
    needs: checks
    runs-on: ubuntu-latest
    # El Environment "production" en GitHub debe tener un reviewer requerido:
    # ese approval manual es el gate de promoción de staging a producción.
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Aplicar migraciones de Prisma (producción)
        run: npx prisma migrate deploy

      - name: Configurar entorno de Vercel (producción)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build de Vercel (producción)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy a Vercel (producción)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
