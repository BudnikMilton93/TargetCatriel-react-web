name: Deploy a staging

on:
  push:
    branches: [staging]

jobs:
  checks:
    name: Lint, typecheck, tests y build
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrar y desplegar a staging
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Aplicar migraciones de Prisma (staging)
        run: npx prisma migrate deploy

      - name: Configurar entorno de Vercel (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build de Vercel (preview)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy a Vercel (preview / staging)
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
